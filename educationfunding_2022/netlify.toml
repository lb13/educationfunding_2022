[build]
  command = "hugo --minify"
  publish = "public"

[build.environment]
  HUGO_VERSION = "0.128.0"

[functions]
  directory = "netlify/functions"

[[redirects]]
  from   = "/england/further-education/"
  to     = "/"
  status = 301
  force  = true

[[headers]]
  # Define which paths this specific [[headers]] block will cover.
  for = "/*"
    [headers.values]
    Access-Control-Allow-Origin = "*"
